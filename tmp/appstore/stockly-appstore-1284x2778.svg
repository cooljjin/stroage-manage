<svg xmlns="http://www.w3.org/2000/svg" width="1284" height="2778" viewBox="0 0 1284 2778">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d1d0ff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#d1d0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="phoneShadow" x="-35%" y="-25%" width="170%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#171750" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#5757ff" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1284" height="2778" fill="url(#bg)"/>
  <ellipse cx="1050" cy="760" rx="520" ry="620" fill="url(#glow)"/>
  <ellipse cx="140" cy="2320" rx="440" ry="520" fill="#e5e5ff" opacity="0.48"/>
  <circle cx="1220" cy="120" r="220" fill="#f1f1ff" opacity="0.9"/>
  <path d="M80 1000C280 930 470 930 640 1000" fill="none" stroke="#e5e5ff" stroke-width="3" opacity="0.8"/>

  <text x="98" y="398" font-family="Apple SD Gothic Neo, Inter, sans-serif" font-size="34" font-weight="700" fill="#5757ff">통합 매장 재고관리 솔루션</text>
  <text x="94" y="570" font-family="Apple SD Gothic Neo, Inter, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#081238">재고 확인부터</text>
  <text x="94" y="700" font-family="Apple SD Gothic Neo, Inter, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#081238">발주까지,</text>
  <text x="94" y="830" font-family="Apple SD Gothic Neo, Inter, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#5757ff">한곳에서</text>
  <text x="98" y="946" font-family="Apple SD Gothic Neo, Inter, sans-serif" font-size="38" font-weight="500" fill="#475569">매장 재고 업무를 한 화면에서</text>
  <text x="98" y="1000" font-family="Apple SD Gothic Neo, Inter, sans-serif" font-size="38" font-weight="500" fill="#475569">빠르게 관리하세요.</text>

  <g font-family="Apple SD Gothic Neo, Inter, sans-serif" font-size="27" font-weight="700">
    <rect x="98" y="1048" width="182" height="60" rx="30" fill="#e5e5ff"/>
    <text x="189" y="1087" text-anchor="middle" fill="#4948f7">재고 현황</text>
    <rect x="298" y="1048" width="202" height="60" rx="30" fill="#e5e5ff"/>
    <text x="399" y="1087" text-anchor="middle" fill="#4948f7">바코드 스캔</text>
    <rect x="518" y="1048" width="182" height="60" rx="30" fill="#e5e5ff"/>
    <text x="609" y="1087" text-anchor="middle" fill="#4948f7">발주 관리</text>
  </g>

  <g filter="url(#phoneShadow)">
    <rect x="170" y="1135" width="944" height="1580" rx="148" fill="#11152d"/>
    <rect x="190" y="1155" width="904" height="1540" rx="130" fill="#34384c" stroke="#7e83a1" stroke-width="5"/>
    <rect x="219" y="1184" width="846" height="1482" rx="106" fill="#ffffff" stroke="#0a0d1e" stroke-width="13"/>
    <rect x="548" y="1200" width="188" height="44" rx="22" fill="#0a0d1e"/>
    <rect x="160" y="1535" width="18" height="136" rx="9" fill="#34384c"/>
    <rect x="160" y="1694" width="18" height="82" rx="9" fill="#34384c"/>
    <rect x="1106" y="1558" width="18" height="194" rx="9" fill="#34384c"/>
  </g>

</svg>
