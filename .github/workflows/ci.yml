name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build customer app
        run: npm run build

      - name: Build admin console
        run: npm run build:admin

      - name: Lint source
        run: npx eslint src admin-console/src

      - name: Check whitespace errors
        run: git diff --check
